<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBITA — восстановление пароля</title><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="assets/account.css"><link rel="stylesheet" href="assets/security.css"></head><body class="security-page" data-security-page="reset"><header><a href="index.html">◌ ORBITA</a><a href="account.html">Войти ↗</a></header><main><section class="security-card single-panel"><p class="eyebrow">ORBITA / ВОССТАНОВЛЕНИЕ ДОСТУПА</p><h1 id="resetTitle">Не помните пароль?</h1><p id="resetExplanation">Укажите email аккаунта. Если он зарегистрирован, на него придёт ссылка для смены пароля.</p><form id="requestResetForm"><label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required placeholder="you@example.com"></label><button type="submit">Запросить ссылку</button></form><form id="resetPasswordForm" hidden><label>Новый пароль<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="Не менее 10 символов"></label><label>Повторите пароль<input name="passwordRepeat" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button type="submit">Сохранить новый пароль</button></form><p id="resetMessage" class="status" role="status" aria-live="polite"></p><div class="security-actions"><a class="security-button secondary" id="resetLogin" href="account.html">К странице входа →</a><button type="button" class="secondary" id="requestAnotherReset" hidden>Запросить новую ссылку</button></div></section></main><script src="assets/access.js"></script><script src="assets/security.js"></script><script src="assets/legal.js"></script></body></html>
